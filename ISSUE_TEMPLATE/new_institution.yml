name: New bank, SACCO or wallet
description: Ask for a parser pack for an institution we don't support yet.
labels: [parser-pack]
body:
  - type: markdown
    attributes:
      value: |
        Parser packs live in [ujumbe-parsers](https://github.com/pesaclarity/ujumbe-parsers).
        Do not paste real messages. Rewrite each sample with made-up names, amounts, numbers and reference codes, keeping the exact wording and punctuation.
  - type: input
    id: institution
    attributes:
      label: Institution
      placeholder: Equity Bank
    validations:
      required: true
  - type: input
    id: sender
    attributes:
      label: SMS sender ID
      placeholder: EQUITYBANK
    validations:
      required: true
  - type: textarea
    id: samples
    attributes:
      label: Anonymised sample messages
      description: One per message type (sent, received, paybill, till, loan, reversal). Made-up values only.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Privacy
      options:
        - label: Every name, number, amount and reference above is made up.
          required: true
